<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek Patel | Jr. MERN Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Abhishek Patel, a Jr. MERN Stack Developer building responsive, scalable web applications with React, TypeScript, Node.js, Express.js and modern backend technologies."
    />
    <meta property="og:title" content="Abhishek Patel | Jr. MERN Stack Developer" />
    <meta
      property="og:description"
      content="A premium developer portfolio featuring full-stack MERN projects, skills, education and contact information."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#09090b" />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const theme = savedTheme === "light" || savedTheme === "dark" || savedTheme === "arcane"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#faf7f2" : theme === "arcane" ? "#080919" : "#05080e";
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
